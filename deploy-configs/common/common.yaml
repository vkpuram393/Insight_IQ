#app related data
app:
  name: pss-myclaims-ai-agent
  port: 8000
  gitRepoName: cvs-health-source-code/pss-myclaims-ai-agent
  projectId: pbm-nonprod-myclaims

#livenessProbe details
livenessProbeDetails:
  probePath: "/health"
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 3
  successThreshold: 1

#readinessProbe details
readinessProbeDetails:
  probePath: "/health"
  initialDelaySeconds: 15
  periodSeconds: 5
  timeoutSeconds: 10
  failureThreshold: 1
  successThreshold: 1

#startupProbe details
startupProbeDetails:
  probePath: "/health"
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 15
  failureThreshold: 20
  successThreshold: 1
 
istioHttpRoutes:
  routes:
    - route: "/pss-myclaims-ai-agent/"
      matchHeaders: '^(.*?;)?\s*(canary=on)(;.*)?$'
    - route: "/"
    - route: "/api/"
    - route: "/docs/"
    - route: "/health"
    - route: "/pss/pbmassist/v1"
    - route: "/pss/pbmassist/"
