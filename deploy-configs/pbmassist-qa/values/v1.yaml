#namespace, app version and image details3
envName: pbmassist-qa
skipSecurityContext: true
projectId: pbm-nonprod-myclaims   # top-level projectId

#Workload Identity configuration..
workloadIdentity:
  enabled: true
  # ksaName: sa-myclaims-ai-dev
  # serviceAccounts: sa-myclaims-ai-dev@pbm-nonprod-myclaims.iam.gserviceaccount.com
  # projectId: pbm-nonprod-myclaims
  gcpProject: pbm-nonprod-myclaims
  serviceAccountName: sa-myclaims-ai-dev
  serviceAccountEmail: sa-myclaims-ai-dev@pbm-nonprod-myclaims.iam.gserviceaccount.com

# App metadata
appData:
  envName: pbmassist-qa
  nameSpace: pbmassist-qa
  dockerHub: cvsh.jfrog.io
  dockerImageGroupName: cvsdigital-docker/ghemu/cvs-health-source-code/pss-myclaims-ai-agent
  dockerImageName: pss-myclaims-ai-agent
  dockerImageTag: e0c8f47825ecc1a6050a0792731524fd49a8ae75  # This will be overridden by the deployment workflow with git SHA tag.


#hpa settings - min and max replicas and minAvailable for PDB
hpaSettings: 
  minAvailable: 3
  minReplicas: 3
  maxReplicas: 3
  averageUtilization: 80

# Pod resource requests and limits
resources:
  requests:
    cpu: "4000m"
    memory: "8Gi"
  limits:
    cpu: "4000m"
    memory: "8Gi"

# environment variables for app - secret values come from vault.
envVars: |
  - name: ENABLE_TRACING
    value: 'true'
  - name: ENV
    value: qa
  - name: ENVIRONMENT
    value: "qa"
  - name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
    value: https://otelc-gmp-collector-grpc.nonprod.aig.aetna.com
  - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
    value: https://otelc-traces-collector-grpc.nonprod.aig.aetna.com
  - name: OTEL_SERVICE_NAME
    value: APM0017166
  - name: GCP_PROJECT_ID
    value: pbm-nonprod-myclaims
  - name: PROJECT_ID
    value: pbm-nonprod-myclaims
  - name: ENV_NAME
    value: pbmassist-qa
  - name: LOCATION
    value: us-east4
  - name: APP_NAME
    value: pss-myclaims-ai-agent
  - name: APP_VERSION
    value: "2.0.1.4"
  - name: LOG_LEVEL
    value: INFO
  - name: USE_MOCK_LLM
    value: "false"
  - name: LLM_MODEL
    value: "gemini-2.5-flash"
  - name: DATABASE_URI
    value: "sqlite:///:memory:"
  - name: REDIS_URI
    value: "redis://localhost:6379/0"
  - name: PERSISTENCE_STORE_TYPE
    value: "mongodb"
  - name: MONGODB_HOST
    value: "mdb-use4-myclaims-dev01-pl-0.knpouh.mongodb.net"
  - name: MONGODB_DATABASE_NAME
    value: "myclaims-QA"
  # ⚠️ MONGODB_USER and MONGODB_PASSWORD are injected by Vault sidecar via envSecrets


# Environment secrets from HashiCorp Vault.
envSecrets: |-
  - secretRef:
      name: pss-myclaims-secrets-qa



istioHttpRoutes:
  routes:
    - route: "/pss-myclaims-ai-agent/"
      matchHeaders: '^(.*?;)?\s*(canary=on)(;.*)?$'
    - route: "/"
    - route: "/api/"
    - route: "/docs/"
    - route: "/health"
    - route: "/pss/pbmassist/v1"
    - route: "/pss/pbmassist/"
    - route: "/debug/memory/"
    - route: "/debug/memory/reset-baseline"
## Triggers 3
  
